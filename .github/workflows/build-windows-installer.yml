name: build-windows-installer

# Build Windows offline installer (.exe) từ 3 bundle PyInstaller + ffmpeg +
# model whisper medium, gộp bằng Inno Setup. Chạy trên windows-latest vì
# PyInstaller không cross-compile được — build cho Windows PHẢI chạy trên
# Windows. Chưa có máy Windows để test trực tiếp, nên workflow này là điểm
# verify chính; nhiều khả năng cần vài lần sửa qua log CI trước khi ra
# installer chạy được thật.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      # ---------- pyvideotrans (Python 3.10) ----------
      - name: Setup pyvideotrans venv + deps
        working-directory: vendor/pyvideotrans
        shell: pwsh
        run: |
          uv venv --python 3.10 .venv
          uv sync
          .venv\Scripts\python.exe -m pip install pyinstaller

      - name: Build pyvideotrans_cli.exe
        shell: pwsh
        run: |
          vendor\pyvideotrans\.venv\Scripts\pyinstaller.exe installer\pyvideotrans_cli.spec `
            --distpath dist_stage_raw --workpath build_tmp\pyvideotrans --noconfirm

      # ---------- video-subtitle-remover (Python 3.12) ----------
      - name: Setup VSR venv + deps
        working-directory: vendor/video-subtitle-remover
        shell: pwsh
        run: |
          uv venv --python 3.12 videoEnv
          uv pip install --python videoEnv\Scripts\python.exe paddlepaddle==3.0.0 -i https://www.paddlepaddle.org.cn/packages/stable/cpu/
          # torch 2.4.1 (KHÔNG phải 2.7.0 CPU-only như trước) + torch_directml
          # - DirectML chạy qua DirectX 12 nên dùng được với MỌI GPU trên
          # Windows (AMD/NVIDIA/Intel), không riêng 1 hãng như CUDA (NVIDIA-
          # only) hay ROCm (AMD-only, không hỗ trợ Windows tốt).
          # backend/tools/hardware_accelerator.py đã tự detect + fallback về
          # CPU an toàn nếu không có torch_directml hoặc GPU không tương
          # thích DX12 — chỉ cần cài đúng cặp version này (torch_directml
          # 0.2.5.dev240914 yêu cầu chính xác torch 2.4.1, theo Dockerfile
          # gốc của video-subtitle-remover).
          uv pip install --python videoEnv\Scripts\python.exe torch==2.4.1 torchvision==0.19.1
          uv pip install --python videoEnv\Scripts\python.exe torch_directml==0.2.5.dev240914
          uv pip install --python videoEnv\Scripts\python.exe -r requirements.txt
          uv pip install --python videoEnv\Scripts\python.exe pyinstaller

      - name: Build vsr_cli.exe
        shell: pwsh
        run: |
          vendor\video-subtitle-remover\videoEnv\Scripts\pyinstaller.exe installer\vsr_cli.spec `
            --distpath dist_stage_raw --workpath build_tmp\vsr --noconfirm

      # ---------- web_server (Python 3.12) ----------
      - name: Setup web_env + deps
        shell: pwsh
        run: |
          uv venv --python 3.12 web_env
          # huggingface_hub ghim dung ban pyvideotrans dang dung (xem
          # vendor/pyvideotrans/pyproject.toml) de dam bao API snapshot_download
          # (tham so local_dir_use_symlinks) hoat dong giong nhu code goc.
          uv pip install --python web_env\Scripts\python.exe fastapi "uvicorn[standard]" python-multipart edge-tts pyinstaller "huggingface_hub==1.10.0"

      - name: Build web_server.exe
        shell: pwsh
        run: |
          web_env\Scripts\pyinstaller.exe installer\web_server.spec `
            --distpath dist_stage_raw --workpath build_tmp\web_server --noconfirm

      # ---------- assemble staging layout cho Inno Setup ----------
      - name: Assemble staging directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist_stage\web_server, dist_stage\pyvideotrans, dist_stage\vsr, dist_stage\ffmpeg, dist_stage\pvt_models | Out-Null
          Copy-Item dist_stage_raw\web_server\* dist_stage\web_server -Recurse -Force
          Copy-Item dist_stage_raw\pyvideotrans_cli\* dist_stage\pyvideotrans -Recurse -Force
          Copy-Item dist_stage_raw\vsr_cli\* dist_stage\vsr -Recurse -Force
          # Bắt buộc pyvideotrans chạy offline (không tự thử tải model qua mạng
          # nếu bundle thiếu model — xem videotrans/configure/_paths.py, IF
          # netoffline.txt tồn tại -> set HF_HUB_OFFLINE=1). Model đã được bundle
          # sẵn ở bước dưới nên offline vẫn chạy được.
          New-Item -ItemType File -Path dist_stage\pyvideotrans\netoffline.txt -Force | Out-Null

      # ---------- ffmpeg tĩnh dùng chung cho orchestrator.py (cần libass để burn sub) ----------
      # Dùng bản gắn version (n8.1) thay vì "master" — release "latest" của
      # BtbN bị rebuild liên tục, asset "master" hay rơi vào lúc đang
      # republish (404 "Not Found" thoáng qua, phát hiện qua chạy CI thật lần
      # trước) còn asset theo version cụ thể ổn định hơn. Thêm retry cho
      # chắc vì đây là dependency mạng ngoài, không tự kiểm soát được.
      - name: Download shared ffmpeg (static, libass build)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
              break
            } catch {
              Write-Host "Download attempt $i failed: $_"
              if ($i -eq 5) { throw }
              Start-Sleep -Seconds (10 * $i)
            }
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_extract
          $bin = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $bin.FullName dist_stage\ffmpeg\ffmpeg.exe
          $probe = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $probe.FullName dist_stage\ffmpeg\ffprobe.exe

      # ---------- tải sẵn model whisper "medium" (offline bundling) ----------
      # pyvideotrans doc model.bin/config.json truc tiep tu
      # <ROOT>/models/models--<org>--<name>/ (khong co tang snapshots/blobs) -
      # xem videotrans/util/help_down.py: sau khi snapshot_download(local_dir=..)
      # xong, no tu xoa het cac thu muc cache blobs/refs/snapshots/.cache/
      # .no_exist, chi giu file thuc su nam thang trong local_dir. Lan build
      # truoc dung HF_HUB_CACHE (kieu cache mac dinh, model.bin chi la symlink
      # trong snapshots/<hash>/, file thuc nam trong blobs/) khong khop cau
      # truc nay -> RuntimeError "Unable to open file 'model.bin'" khi chay
      # thuc te tren Windows. Sua lai dung y nhu pyvideotrans tu lam.
      - name: Pre-download faster-whisper medium model
        shell: pwsh
        run: |
          $localDir = "dist_stage\pvt_models\models--Systran--faster-whisper-medium"
          New-Item -ItemType Directory -Force -Path $localDir | Out-Null
          web_env\Scripts\python.exe -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-medium', local_dir=r'$localDir', local_dir_use_symlinks=False)"
          foreach ($junk in @('blobs', 'refs', 'snapshots', '.cache', '.no_exist')) {
            $p = Join-Path $localDir $junk
            if (Test-Path $p) { Remove-Item -Recurse -Force $p }
          }
          $modelBin = Join-Path $localDir "model.bin"
          if (-not (Test-Path $modelBin) -or (Get-Item $modelBin).Length -eq 0) {
            throw "model.bin thieu hoac rong sau khi tai + don rac tai $modelBin"
          }

      # ---------- gộp thành setup.exe bằng Inno Setup ----------
      # KHÔNG dùng action Minionguyjpro/Inno-Setup-Action — bug thật trong
      # wrapper Node.js của action đó (TypeError ERR_INVALID_ARG_TYPE khi
      # process.exitCode nhận string) khi ISCC in ra quá nhiều dòng
      # "Compressing: ..." (bundle vsr ~1.4GB, hàng chục nghìn file nhỏ của
      # torch/PySide6) — phát hiện qua chạy CI thật lần trước. Cài Inno Setup
      # qua Chocolatey và gọi ISCC.exe trực tiếp với /Q (quiet) để vừa tránh
      # bug action, vừa tránh log khổng lồ.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "installer\setup.iss" "/DStageDir=${{ github.workspace }}\dist_stage"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe exited with code $LASTEXITCODE" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazinoVideoLocalizer-Setup
          path: dist_installer/*.exe
          retention-days: 14

      # ---------- publish lên GitHub Release (tải nhanh hơn Actions Artifact) ----------
      # Actions Artifact dùng hạ tầng lưu trữ riêng của Actions, tốc độ tải
      # file lớn (~4GB) rất chậm/không ổn định trong thực tế (phát hiện qua
      # test thật: >2h cho 1 file dù đường truyền mạng không phải nguyên
      # nhân). GitHub Releases dùng CDN riêng (Fastly), tải nhanh hơn nhiều
      # và hỗ trợ resume. Ghi đè tag "latest" mỗi lần build để user luôn có
      # 1 link cố định trỏ tới bản mới nhất.
      - name: Publish installer to GitHub Release (faster download)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem -Path dist_installer -Filter *.exe | Select-Object -First 1
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" 2>$null
          gh release create latest $exe.FullName `
            --repo "${{ github.repository }}" `
            --title "Mazino Video Localizer (ban moi nhat)" `
            --notes "Auto-build tu commit ${{ github.sha }}. Tai file .exe ben duoi - nhanh hon nhieu so voi Artifact cua Actions."
